<div class="container">
  <div class="mb-2">
    <div>
      <button type="button" class="btn btn-outline-primary"
        style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;"
        (click)="IsCollapsed = !IsCollapsed">
        Filter
      </button>
      <button type="button" class="btn btn-outline-secondary"
        style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;"
        (click)="ResetFilters()" [hidden]="!filteering">
        Reset
      </button>
    </div>

    <div [collapse]="IsCollapsed" [isAnimated]="true">
      <div class="border mb-2 shadow-sm p-2 filter-panel">
        <small><b>Technologies :</b></small>
        <div class="tag-list">
          <div class="form-check" *ngFor="let tag of allTags">
            <input type="checkbox"
                   class="form-check-input position-static me-2"
                   [id]="'tag-' + tagLabel(tag)"
                   [checked]="isSelected(tag)"
                   (change)="toggleTag(tag)">
            <label class="form-check-label small" [for]="'tag-' + tagLabel(tag)">
              {{ tagLabel(tag) }}
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-4 col-md-6 col-12 mb-4 project-card-container"
         *ngFor="let tag of projects">
      <app-project-card [project]="tag"></app-project-card>
    </div>
  </div>

  <p *ngIf="projects.length === 0" class="text-center text-muted">
    Aucun projet ne correspond à ces filtres.
  </p>
</div>
